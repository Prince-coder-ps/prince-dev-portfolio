<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2fbfa" />
    <title>Prince Saini — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Prince Saini, a final-year Computer Science student and Full Stack (MERN) Developer. Projects, skills, and contact."
    />
    <meta name="author" content="Prince Saini" />
    <meta property="og:title" content="Prince Saini — Full Stack Developer" />
    <meta
      property="og:description"
      content="Final-year CSE student building full-stack MERN applications. Explore projects, skills, and get in touch."
    />
    <meta property="og:type" content="website" />

    <!-- Apply the saved/system theme before first paint (prevents a light→dark flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts load without blocking first render (variable fonts = fewer files) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
